[package]
name = "cleaner-pc"
version = "0.1.0"
description = "Application de maintenance PC pour Windows"
authors = ["Kerdanet Yvan"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tauri-plugin-opener = "2.7.3"
tauri-plugin-autostart = "2.7.0"
base64 = "0.23.1"
